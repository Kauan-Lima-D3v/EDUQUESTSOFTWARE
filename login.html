<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>EduQuest — Entrar</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#7C3AED;--primary-light:#A78BFA;--secondary:#F59E0B;--accent:#10B981;--danger:#EF4444;--bg:#0A0618;--card:#13093A;--card2:#1E1147;--text:#F3F0FF;--text-muted:#9B8EC4;--border:rgba(167,139,250,0.18);}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    canvas#bg{position:fixed;inset:0;z-index:0;}
    .wrap{position:relative;z-index:10;width:100%;max-width:460px;padding:24px;}
    .logo-area{text-align:center;margin-bottom:32px;}
    .logo-icon{font-size:56px;display:block;animation:bounce 2s ease-in-out infinite;}
    @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
    .logo-text{font-family:'Fredoka One',cursive;font-size:38px;background:linear-gradient(135deg,#A78BFA,#F59E0B,#10B981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .logo-sub{color:var(--text-muted);font-size:14px;font-weight:600;margin-top:4px;}
    .card{background:rgba(19,9,58,0.85);border:1px solid var(--border);border-radius:28px;padding:36px;backdrop-filter:blur(20px);box-shadow:0 32px 80px rgba(0,0,0,0.5);}
    .tabs{display:flex;gap:0;background:rgba(255,255,255,0.06);border-radius:14px;padding:4px;margin-bottom:28px;}
    .tab{flex:1;padding:10px;text-align:center;font-weight:800;font-size:14px;border-radius:11px;cursor:pointer;transition:all .25s;color:var(--text-muted);}
    .tab.active{background:var(--primary);color:#fff;box-shadow:0 4px 16px rgba(124,58,237,0.4);}
    .form-group{margin-bottom:18px;}
    .form-label{display:block;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;}
    .form-input{width:100%;padding:14px 18px;background:rgba(255,255,255,0.06);border:1.5px solid var(--border);border-radius:14px;color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;font-weight:600;outline:none;transition:all .25s;}
    .form-input:focus{border-color:var(--primary-light);background:rgba(124,58,237,0.08);box-shadow:0 0 0 4px rgba(124,58,237,0.12);}
    .form-input::placeholder{color:var(--text-muted);}
    .role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
    .role-btn{padding:12px 8px;border:1.5px solid var(--border);border-radius:14px;background:rgba(255,255,255,0.04);cursor:pointer;text-align:center;transition:all .25s;color:var(--text);}
    .role-btn:hover{border-color:var(--primary-light);}
    .role-btn.active{border-color:var(--primary);background:rgba(124,58,237,0.15);}
    .role-btn .r-icon{font-size:26px;display:block;margin-bottom:4px;}
    .role-btn .r-name{font-size:11px;font-weight:800;}
    .btn-main{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 8px 32px rgba(124,58,237,0.45);transition:all .3s;margin-top:4px;}
    .btn-main:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(124,58,237,0.55);}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text-muted);font-size:12px;font-weight:700;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
    .demo-box{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:14px;padding:14px 16px;}
    .demo-box p{font-size:12px;font-weight:700;color:rgba(245,158,11,0.9);margin-bottom:8px;}
    .demo-creds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
    .demo-cred{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center;cursor:pointer;transition:all .2s;}
    .demo-cred:hover{border-color:var(--primary-light);}
    .demo-cred .dc-icon{font-size:18px;display:block;}
    .demo-cred .dc-role{font-size:10px;font-weight:800;color:var(--primary-light);}
    .demo-cred .dc-pass{font-size:10px;color:var(--text-muted);}
    .err{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;color:#FCA5A5;margin-bottom:14px;display:none;}
    select.form-input option{background:#1E1147;}
  </style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <div class="logo-area">
    <span class="logo-icon">🦉</span>
    <div class="logo-text">EduQuest</div>
    <div class="logo-sub">Aprenda. Evolua. Conquiste.</div>
  </div>
  <div class="card">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Entrar</div>
      <div class="tab" onclick="switchTab('register')">Cadastrar</div>
    </div>

    <!-- LOGIN -->
    <div id="tab-login">
      <div class="err" id="login-err">Email ou senha incorretos.</div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="l-email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input class="form-input" type="password" id="l-senha" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn-main" onclick="doLogin()">🚀 Entrar na Plataforma</button>
      <div class="divider">credenciais demo</div>
      <div class="demo-box">
        <p>🔑 Clique para preencher automaticamente:</p>
        <div class="demo-creds">
          <div class="demo-cred" onclick="fillDemo('aluno@demo.com','123456')">
            <span class="dc-icon">🦊</span>
            <div class="dc-role">Aluno</div>
            <div class="dc-pass">123456</div>
          </div>
          <div class="demo-cred" onclick="fillDemo('pais@demo.com','123456')">
            <span class="dc-icon">👨‍👩‍👧</span>
            <div class="dc-role">Pais</div>
            <div class="dc-pass">123456</div>
          </div>
          <div class="demo-cred" onclick="fillDemo('prof@demo.com','123456')">
            <span class="dc-icon">👩‍🏫</span>
            <div class="dc-role">Prof.</div>
            <div class="dc-pass">123456</div>
          </div>
        </div>
      </div>
    </div>

    <!-- REGISTER -->
    <div id="tab-register" style="display:none">
      <div class="err" id="reg-err">Preencha todos os campos.</div>
      <div class="form-group">
        <label class="form-label">Nome Completo</label>
        <input class="form-input" type="text" id="r-nome" placeholder="Seu nome completo">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="r-email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input class="form-input" type="password" id="r-senha" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="form-group">
        <label class="form-label">Perfil de Acesso</label>
        <div class="role-grid">
          <div class="role-btn active" data-role="aluno" onclick="selectRole(this,'aluno')">
            <span class="r-icon">🦊</span><span class="r-name">Aluno</span>
          </div>
          <div class="role-btn" data-role="pais" onclick="selectRole(this,'pais')">
            <span class="r-icon">👨‍👩‍👧</span><span class="r-name">Pais</span>
          </div>
          <div class="role-btn" data-role="professor" onclick="selectRole(this,'professor')">
            <span class="r-icon">👩‍🏫</span><span class="r-name">Professor</span>
          </div>
        </div>
      </div>
      <button class="btn-main" onclick="doRegister()">✨ Criar Conta Grátis</button>
    </div>
  </div>
</div>
<script>
// Seed demo users
(function(){
  const users = JSON.parse(localStorage.getItem('eq_users')||'[]');
  const demos = [
    {id:'demo-aluno',nome:'Aluno Demo',email:'aluno@demo.com',senha:'123456',role:'aluno',nivel:5,xp:1200,moedas:500,streak:7,badges:['🏆','⭐','🔥'],missoes:['m1','m2'],avatar:'🦊',ownedAvatars:['s1','s2']},
    {id:'demo-pais',nome:'Pais Demo',email:'pais@demo.com',senha:'123456',role:'pais',nivel:1,xp:0,moedas:0,streak:0,badges:[],missoes:[],avatar:'👨‍👩‍👧',ownedAvatars:['s1']},
    {id:'demo-prof',nome:'Prof. Demo',email:'prof@demo.com',senha:'123456',role:'professor',nivel:1,xp:0,moedas:0,streak:0,badges:[],missoes:[],avatar:'👩‍🏫',ownedAvatars:['s1']},
  ];
  demos.forEach(d=>{
    if(!users.find(u=>u.email===d.email)) users.push(d);
  });
  localStorage.setItem('eq_users',JSON.stringify(users));
})();

let selectedRole='aluno';
function switchTab(t){
  document.getElementById('tab-login').style.display=t==='login'?'block':'none';
  document.getElementById('tab-register').style.display=t==='register'?'block':'none';
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',(t==='login'&&i===0)||(t==='register'&&i===1)));
}
function selectRole(el,role){
  selectedRole=role;
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}
function fillDemo(email,pass){
  document.getElementById('l-email').value=email;
  document.getElementById('l-senha').value=pass;
}
function doLogin(){
  const email=document.getElementById('l-email').value.trim();
  const senha=document.getElementById('l-senha').value;
  const users=JSON.parse(localStorage.getItem('eq_users')||'[]');
  const user=users.find(u=>u.email===email&&u.senha===senha);
  const err=document.getElementById('login-err');
  if(!user){err.style.display='block';return;}
  err.style.display='none';
  localStorage.setItem('eq_session',JSON.stringify(user));
  const pages={aluno:'dashboard.html',pais:'pais.html',professor:'professor.html'};
  window.location.href=pages[user.role]||'dashboard.html';
}
function doRegister(){
  const nome=document.getElementById('r-nome').value.trim();
  const email=document.getElementById('r-email').value.trim();
  const senha=document.getElementById('r-senha').value;
  const err=document.getElementById('reg-err');
  if(!nome||!email||senha.length<6){err.style.display='block';err.textContent='Preencha todos os campos (senha mínimo 6 caracteres).';return;}
  const users=JSON.parse(localStorage.getItem('eq_users')||'[]');
  if(users.find(u=>u.email===email)){err.style.display='block';err.textContent='Este email já está cadastrado.';return;}
  err.style.display='none';
  const user={id:'u'+Date.now(),nome,email,senha,role:selectedRole,nivel:1,xp:0,moedas:100,streak:0,badges:[],missoes:[],avatar:'🦊',ownedAvatars:['s1']};
  users.push(user);
  localStorage.setItem('eq_users',JSON.stringify(users));
  localStorage.setItem('eq_session',JSON.stringify(user));
  const pages={aluno:'dashboard.html',pais:'pais.html',professor:'professor.html'};
  window.location.href=pages[selectedRole]||'dashboard.html';
}
// Canvas BG
(function(){
  const c=document.getElementById('bg'),ctx=c.getContext('2d');
  c.width=window.innerWidth;c.height=window.innerHeight;
  const stars=Array.from({length:120},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+.5,s:Math.random()*.5+.2,d:Math.random()>0.5?1:-1}));
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    const g=ctx.createRadialGradient(c.width*.3,c.height*.4,0,c.width*.5,c.height*.5,c.height);
    g.addColorStop(0,'rgba(124,58,237,0.18)');g.addColorStop(0.5,'rgba(91,33,182,0.08)');g.addColorStop(1,'rgba(10,6,24,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);
    stars.forEach(s=>{
      s.y+=s.s*s.d*.15;
      if(s.y<0)s.y=c.height;if(s.y>c.height)s.y=0;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(167,139,250,${0.3+Math.random()*.2})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
  window.addEventListener('resize',()=>{c.width=window.innerWidth;c.height=window.innerHeight;});
})();
</script>
</body>
</html>
